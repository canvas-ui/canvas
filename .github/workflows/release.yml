name: release

# Tag-per-app releases (decided in the migration plan): pushing cli-vX.Y.Z /
# web-vX.Y.Z / desktop-vX.Y.Z / extension-vX.Y.Z builds that app and attaches
# its artifacts to the GitHub Release for the tag. canvas-fuse releases from
# its own repo the same way (v* tags there). Each job asserts the tag version
# matches the app's manifest so a stray tag can't publish mislabeled artifacts.
#
# canvas-server consumes web via the versioned tarball URL — after a web
# release, bump the URL in canvas-server/package.json.

on:
  push:
    tags:
      - 'cli-v*'
      - 'web-v*'
      - 'desktop-v*'
      - 'extension-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    if: startsWith(github.ref_name, 'web-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert tag matches apps/web version
        run: |
          v="${GITHUB_REF_NAME#web-v}"
          m=$(node -p "require('./apps/web/package.json').version")
          [ "$v" = "$m" ] || { echo "tag $v != manifest $m"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter canvas-web run build
      - run: node scripts/pack-web-artifact.mjs artifacts
      - name: Checksums
        run: cd artifacts && sha256sum *.tgz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: canvas-web ${{ github.ref_name }} (prebuilt dist)
          body: >
            Prebuilt web UI artifact for canvas-server. Dependency-free
            tarball (package.json + dist/); consume as an npm tarball-URL
            dependency and pin the exact URL.
          files: |
            artifacts/*.tgz
            artifacts/SHA256SUMS

  cli:
    if: startsWith(github.ref_name, 'cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v4
      - name: Assert tag matches apps/cli version
        run: |
          v="${GITHUB_REF_NAME#cli-v}"
          m=$(node -p "require('./apps/cli/package.json').version")
          [ "$v" = "$m" ] || { echo "tag $v != manifest $m"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Writes the .npmrc auth line that reads NODE_AUTH_TOKEN below.
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      # bun cross-compiles all targets from one Linux runner.
      - name: Build binaries
        run: |
          pnpm --filter @augmentd-labs/canvas-cli run build:linux
          pnpm --filter @augmentd-labs/canvas-cli run build:linux-arm
          pnpm --filter @augmentd-labs/canvas-cli run build:macos
          pnpm --filter @augmentd-labs/canvas-cli run build:macos-arm
          pnpm --filter @augmentd-labs/canvas-cli run build:windows
      # Never attach a binary that doesn't start or reports the wrong version.
      # Same script ci.yml runs, so a green PR means a releasable build.
      - name: Verify binaries
        run: bash apps/cli/scripts/verify-binaries.sh "${GITHUB_REF_NAME#cli-v}"
      - name: Checksums
        run: cd apps/cli/dist && sha256sum canvas-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: canvas-cli ${{ github.ref_name }}
          body: >
            Single-file canvas CLI binaries (bun-compiled) for Linux
            x64/arm64, macOS x64/arm64 and Windows x64.
          files: |
            apps/cli/dist/canvas-linux
            apps/cli/dist/canvas-linux-arm
            apps/cli/dist/canvas-macos
            apps/cli/dist/canvas-macos-arm
            apps/cli/dist/canvas-windows.exe
            apps/cli/dist/SHA256SUMS

      # npm publish runs AFTER the GitHub Release so a registry hiccup can
      # never cost you the binaries. The CLI's three workspace deps go first —
      # pnpm rewrites "workspace:*" to the real versions when it packs, so
      # they must already exist on the registry by the time the CLI lands.
      # Each is skipped when that exact version is already published:
      # packages/* bump far less often than the CLI, and a cli-v tag must not
      # fail just because canvas-protocol didn't change since last release.
      #
      # Auth is a granular NPM_TOKEN today. Once all four packages exist on
      # npmjs, configure Trusted Publishing (OIDC) per package and drop both
      # the secret and NODE_AUTH_TOKEN — the id-token permission above is
      # already what that needs.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          # No token configured (the repo has no NPM_TOKEN today) — skip
          # rather than fail. The binaries above are already released; a
          # missing registry credential must not paint the release red. Add
          # the secret and the very next tag publishes, no workflow edit.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning title=npm publish skipped::NPM_TOKEN is not set — GitHub Release binaries were published, npm packages were not."
            exit 0
          fi
          for dir in packages/protocol packages/schemas packages/api-client apps/cli; do
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver already published — skipping"
              continue
            fi
            echo "Publishing $name@$ver"
            pnpm --filter "$name" publish --access public --no-git-checks
          done

  # Was built on a maintainer's laptop by scripts/update-releases.sh and
  # uploaded with `gh release create`. Built here instead so the zips users
  # install come from a clean runner with a frozen lockfile — and so the same
  # tag-per-app path covers every app.
  extension:
    if: startsWith(github.ref_name, 'extension-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both manifests carry their own version field; all three must agree
      # with the tag, or the stores would receive a mislabeled package.
      - name: Assert tag matches package.json and both manifests
        run: |
          v="${GITHUB_REF_NAME#extension-v}"
          for f in package.json manifest-chromium.json manifest-firefox.json; do
            m=$(node -p "require('./apps/browser-extension/$f').version")
            [ "$v" = "$m" ] || { echo "tag $v != $f $m"; exit 1; }
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter canvas-browser-extension run build
      - name: Verify packages
        working-directory: apps/browser-extension/packages
        run: |
          for z in canvas-extension-chromium.zip canvas-extension-firefox.zip; do
            [ -f "$z" ] || { echo "build produced no $z"; exit 1; }
            unzip -tq "$z" || { echo "$z is not a valid zip"; exit 1; }
          done
          sha256sum canvas-extension-*.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: canvas-browser-extension ${{ github.ref_name }}
          body: >
            Chromium (Chrome, Edge, Brave, Opera) and Firefox packages.
            Store submissions are a separate, manually approved step — these
            zips are the exact artifacts uploaded there.
          files: |
            apps/browser-extension/packages/canvas-extension-chromium.zip
            apps/browser-extension/packages/canvas-extension-firefox.zip
            apps/browser-extension/packages/SHA256SUMS

  desktop:
    if: startsWith(github.ref_name, 'desktop-v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Assert tag matches tauri.conf version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#desktop-v}"
          m=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          [ "$v" = "$m" ] || { echo "tag $v != manifest $m"; exit 1; }
      - name: Linux system deps (Tauri v2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # Builds the frontend (beforeBuildCommand), the Rust bundle, and
      # attaches installers to the release for this tag. Unsigned bundles —
      # code signing is a later, cert-holding-human task.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Canvas Desktop ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
