# Every push to main auto-updates every release — by running the SAME script a
# human runs (scripts/update-releases.sh all), so CI and muscle memory can
# never drift:
#   web        rebuilt and force-published to the web-dist branch every push
#              (deployments re-resolve the branch on their next update)
#   extension  tagged when its version has no tag yet → release.yml builds
#   cli        auto patch-bumped (--autobump) whenever apps/cli or a workspace
#              package it depends on changed since the last cli-v tag, then
#              tagged → release.yml builds and attaches the binaries
#   desktop    tagged when its version has no tag yet → release.yml builds
# So: bump an app's version in a push and its release happens by itself;
# push without a bump and only the web (version-less branch artifact) moves —
# except the CLI, which bumps itself when its code moved (AUTOBUMP_APPS in
# scripts/update-releases.sh). That auto-bump is a commit pushed to main; the
# push it causes re-runs this workflow once, finds nothing new, and stops.
name: auto-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write # gh workflow run release.yml (token-pushed tags don't auto-trigger)

concurrency:
  group: auto-release
  # NOT cancel-in-progress: a run that auto-bumps pushes its own commit to
  # main, which starts a newer run that would cancel the one mid-release.
  # Observed on cli-v2.1.11: the bumping run finished as "cancelled" and only
  # got away with it because the tag was already pushed. Cancelled a second
  # earlier and main would carry a bump with no tag behind it. Runs are
  # already idempotent (--skip-existing, and web's branch push is a force
  # push), so queueing costs ~40s and risks nothing.

jobs:
  release-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # a real branch checkout — the script refuses detached HEAD
          fetch-depth: 0 # full history + tags: skip-existing checks need them
          # --autobump pushes a version-bump commit to main, which is
          # protected by a required `cla` status check. Admins bypass it
          # (enforce_admins is off) but github-actions[bot] does not, so that
          # push may be rejected. If it is, add a RELEASE_TOKEN secret (a PAT
          # from an admin with contents:write) and it is used automatically —
          # no workflow edit. A PAT-pushed tag also triggers release.yml
          # directly, making the explicit dispatch below a harmless no-op.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/update-releases.sh all --autobump
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
