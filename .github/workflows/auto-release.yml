# Every push to main auto-updates every release — by running the SAME script a
# human runs (scripts/update-releases.sh all), so CI and muscle memory can
# never drift:
#   web        rebuilt and force-published to the web-dist branch every push
#              (deployments re-resolve the branch on their next update)
#   extension  released (tag + zips) only when its version has no tag yet
#   cli        tagged when its version has no tag yet → release.yml builds
#   desktop    tagged when its version has no tag yet → release.yml builds
# So: bump an app's version in a push and its release happens by itself;
# push without a bump and only the web (version-less branch artifact) moves.
name: auto-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write # gh workflow run release.yml (token-pushed tags don't auto-trigger)

concurrency:
  group: auto-release
  cancel-in-progress: true

jobs:
  release-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # a real branch checkout — the script refuses detached HEAD
          fetch-depth: 0 # full history + tags: skip-existing checks need them
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/update-releases.sh all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
