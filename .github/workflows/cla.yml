# CLA enforcement (CLA Assistant Lite, contributor-assistant/github-action).
# Only packages/* is dual-licensed and CLA-covered (see CONTRIBUTING.md), so
# the status check is created only for pull requests that touch packages/**.
# apps/* stays DCO-only and this workflow ignores it. The issue_comment
# trigger cannot be path-filtered; a sign comment on an apps-only PR just
# records the (harmless) signature. Signatures live on the `cla-signatures`
# branch of this repository. Runs entirely on GITHUB_TOKEN.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
    paths:
      - 'packages/**'

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA document and I hereby sign the CLA.') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla/signatures.json'
          path-to-document: 'https://github.com/canvas-ui/canvas-server/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'idncsk,*[bot]'
          custom-pr-sign-comment: 'I have read the CLA document and I hereby sign the CLA.'
