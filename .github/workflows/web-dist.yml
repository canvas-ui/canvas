# Auto-publish the built web UI to the `web-dist` branch on every main push
# that touches it. The branch holds ONLY { package.json, dist/ } — a
# dependency-free npm package — so consumers pin a BRANCH, not a release:
#
#   "canvas-web": "github:canvas-ui/canvas#web-dist"
#
# A push to apps/web is then enough to update every deployment (their update
# refresh re-resolves the ref), with no tag/release step in the loop. The
# web-v* release tarballs (release.yml) remain for pinned/offline installs.
name: web-dist

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-dist
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter canvas-web run build
      - name: Publish dist to the web-dist branch
        run: |
          set -euo pipefail
          ver=$(node -p "require('./apps/web/package.json').version")
          rev=$(git rev-parse --short HEAD)
          stage=$(mktemp -d)
          cp -r apps/web/dist "$stage/dist"
          node -e "
            const p = require('./apps/web/package.json');
            require('fs').writeFileSync(process.argv[1] + '/package.json', JSON.stringify({
              name: 'canvas-web',
              version: p.version,
              description: 'Prebuilt Canvas web UI — auto-published from apps/web on every main push (web-dist branch)',
              license: p.license,
              files: ['dist'],
              canvasRev: '$rev',
            }, null, 2) + '\n');
          " "$stage"
          cd "$stage"
          git init -b web-dist
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "canvas-web $ver (main@$rev)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
