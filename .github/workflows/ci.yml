name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version input: pnpm/action-setup reads the packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      # Build every shipped target on every PR, not just the dev binary: bun
      # cross-compiles all five from this one Linux runner in well under a
      # minute, and building them only at tag time meant a broken target was
      # discovered during a release instead of during review.
      - name: Build CLI binaries (all release targets)
        run: |
          pnpm --filter @augmentd-labs/canvas-cli run build:linux
          pnpm --filter @augmentd-labs/canvas-cli run build:linux-arm
          pnpm --filter @augmentd-labs/canvas-cli run build:macos
          pnpm --filter @augmentd-labs/canvas-cli run build:macos-arm
          pnpm --filter @augmentd-labs/canvas-cli run build:windows
      - name: Verify CLI binaries
        run: bash apps/cli/scripts/verify-binaries.sh "$(node -p "require('./apps/cli/package.json').version")"
      # Frontend builds only; the Tauri (Rust) bundle needs its own toolchain
      # and is not part of this pipeline yet.
      - run: pnpm --filter canvas-desktop run build
      - run: pnpm --filter canvas-browser-extension run build
      - run: pnpm --filter canvas-web run build
      # Every git-fetchable artifact (web, protocol, schemas, wallpapers,
      # api-client, edge) must stage as a self-contained package on every PR,
      # so a broken bundle fails review, not `npm run release:dist`.
      - name: Stage dist artifacts (pack-dist)
        run: |
          node scripts/pack-dist.mjs all --out artifacts --pack
          ls -la artifacts/*.tgz
      - name: Smoke-test the edge artifact from a git URL
        run: |
          set -e
          bare=$(mktemp -d); git init -q --bare -b edge-dist "$bare"  # HEAD must resolve after the push, or npm's git resolver fails
          ( cd artifacts/dist/edge && git init -q -b edge-dist && git add -A -f \
            && git -c user.name=ci -c user.email=ci@canvas commit -q -m edge-dist && git push -q "$bare" edge-dist )
          consumer=$(mktemp -d); cd "$consumer"; npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "git+file://$bare#edge-dist"
          test -d node_modules/@augmentd-labs/canvas-edge/node_modules/canvas-stored
          CANVAS_USER_HOME=/tmp/edge-ci timeout 8 node node_modules/.bin/canvas-edge --foreground || [ $? -eq 124 ]
